
name: Android 4.4 Browser Emulator

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Start Android 4.4 with SD card, audio and APKs
        shell: bash
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive

          if [ -z "${VNC_PASSWORD:-}" ] || [ "${#VNC_PASSWORD}" -ne 8 ]; then
            echo "ERROR: Set repository secret VNC_PASSWORD to exactly 8 characters."
            exit 1
          fi

          echo "::add-mask::$VNC_PASSWORD"

          echo "STEP 1: Installing dependencies..."

          sudo apt-get update
          sudo apt-get install -y \
            xvfb openbox x11vnc websockify nginx curl ca-certificates git \
            libpulse0 pulseaudio pulseaudio-utils libasound2 \
            libnss3 libglu1-mesa libx11-6 libxrender1 libxtst6 \
            libxi6 libxrandr2 libxcursor1 libxcomposite1 \
            libxdamage1 libxfixes3 libxkbcommon0 \
            libxkbcommon-x11-0 libxcb-xinerama0 \
            build-essential python3 pkg-config libopus-dev

          npm install --global pnpm@10

          echo "STEP 2: Starting the virtual desktop..."

          export DISPLAY=:0

          Xvfb :0 -screen 0 800x900x24 \
            -ac -nolisten tcp +extension GLX +render -noreset \
            >/tmp/xvfb.log 2>&1 &
          XVFB_PID=$!

          sleep 2

          if ! kill -0 "$XVFB_PID" 2>/dev/null; then
            cat /tmp/xvfb.log
            echo "ERROR: Xvfb failed to start."
            exit 1
          fi

          openbox >/tmp/openbox.log 2>&1 &

          x11vnc -storepasswd "$VNC_PASSWORD" /tmp/vnc.pass \
            >/dev/null
          chmod 600 /tmp/vnc.pass

          x11vnc -display :0 -forever -shared \
            -localhost -rfbport 5900 -rfbauth /tmp/vnc.pass \
            -wait 10 -defer 10 \
            >/tmp/x11vnc.log 2>&1 &
          VNC_PID=$!

          echo "STEP 3: Building the audio-enabled noVNC client..."

          git clone --depth 1 \
            https://github.com/babelcloud/noVNC.git \
            /tmp/babelcloud-novnc

          (
            cd /tmp/babelcloud-novnc
            pnpm install --no-frozen-lockfile
            pnpm run build
          )

          if [ ! -f /tmp/babelcloud-novnc/build/vnc.html ]; then
            echo "ERROR: noVNC build did not produce build/vnc.html."
            find /tmp/babelcloud-novnc -maxdepth 3 \
              -name vnc.html -print
            exit 1
          fi

          echo "Starting WebSocket proxy..."

          websockify 127.0.0.1:6081 127.0.0.1:5900 \
            >/tmp/websockify.log 2>&1 &
          WEBSOCKIFY_PID=$!

          echo "STEP 4: Configuring the browser server..."

          sudo tee /etc/nginx/conf.d/android44.conf >/dev/null <<'NGINX'
          server {
              listen 127.0.0.1:6080;
              server_name _;

              root /tmp/babelcloud-novnc/build;
              index vnc.html;

              location /websockify {
                  proxy_pass http://127.0.0.1:6081/;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_read_timeout 3600s;
                  proxy_send_timeout 3600s;
              }

              location = /audio {
                  proxy_pass http://127.0.0.1:6090/audio;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_read_timeout 3600s;
                  proxy_send_timeout 3600s;
              }

              location / {
                  try_files $uri $uri/ =404;
              }
          }
          NGINX

          sudo nginx -t
          sudo service nginx restart

          echo "Checking noVNC..."

          HTTP_READY=0

          for i in $(seq 1 30); do
            if curl -fsS \
              http://127.0.0.1:6080/vnc.html \
              >/dev/null; then
              HTTP_READY=1
              break
            fi
            sleep 1
          done

          if [ "$HTTP_READY" -ne 1 ]; then
            echo "ERROR: noVNC is not responding."
            cat /tmp/websockify.log
            exit 1
          fi

          echo "STEP 5: Starting Cloudflare Tunnel..."

          curl -fL --retry 3 \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb \
            -o /tmp/cloudflared.deb

          sudo dpkg -i /tmp/cloudflared.deb

          cloudflared tunnel \
            --url http://127.0.0.1:6080 \
            --no-autoupdate \
            --loglevel info \
            >/tmp/cloudflared.log 2>&1 &
          TUNNEL_PID=$!

          tail -n +1 -F /tmp/cloudflared.log &
          LOG_TAIL_PID=$!

          URL=""

          for i in $(seq 1 90); do
            URL="$(grep -Eo \
              'https://[[:alnum:]-]+\.trycloudflare\.com' \
              /tmp/cloudflared.log | head -n 1 || true)"

            if [ -n "$URL" ]; then
              break
            fi

            if ! kill -0 "$TUNNEL_PID" 2>/dev/null; then
              echo "ERROR: Cloudflare Tunnel stopped."
              cat /tmp/cloudflared.log
              exit 1
            fi

            sleep 2
          done

          if [ -z "$URL" ]; then
            echo "ERROR: No Cloudflare URL was generated."
            cat /tmp/cloudflared.log
            exit 1
          fi

          BROWSER_URL="${URL}/vnc.html?autoconnect=true&resize=scale&quality=5&compression=1"

          echo ""
          echo "============================================"
          echo "YOUR ANDROID 4.4 BROWSER LINK:"
          echo "$BROWSER_URL"
          echo "============================================"
          echo ""

          echo "::notice title=Android 4.4 Browser Link::$BROWSER_URL"

          echo "STEP 6: Setting up PulseAudio..."

          AUDIO_ENABLED=1
          AUDIO_PID=""

          export XDG_RUNTIME_DIR="/tmp/runtime-${UID}"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          export PULSE_SERVER="unix:${XDG_RUNTIME_DIR}/pulse/native"

          if pulseaudio \
            --daemonize=yes \
            --exit-idle-time=-1 \
            --log-target=file:/tmp/pulseaudio.log; then

            PULSE_READY=0

            for i in $(seq 1 20); do
              if pactl info >/dev/null 2>&1; then
                PULSE_READY=1
                break
              fi
              sleep 1
            done

            if [ "$PULSE_READY" -eq 1 ]; then
              if pactl load-module module-null-sink \
                sink_name=android_sink \
                sink_properties=device.description=AndroidAudioSink \
                rate=48000 channels=2; then
                pactl set-default-sink android_sink
                echo "PulseAudio audio sink is ready."
              else
                echo "WARNING: Could not create audio sink."
                AUDIO_ENABLED=0
              fi
            else
              echo "WARNING: PulseAudio did not become ready."
              cat /tmp/pulseaudio.log || true
              AUDIO_ENABLED=0
            fi
          else
            echo "WARNING: PulseAudio failed to start."
            AUDIO_ENABLED=0
          fi

          echo "STEP 7: Building the audio server..."

          if [ "$AUDIO_ENABLED" -eq 1 ]; then
            if git clone --depth 1 \
              https://github.com/babelcloud/novnc-audio-server.git \
              /tmp/novnc-audio-server; then

              if (
                cd /tmp/novnc-audio-server
                pnpm install --no-frozen-lockfile
                pnpm run build
              ); then

                (
                  cd /tmp/novnc-audio-server
                  exec node dist/main.js \
                    --host 127.0.0.1 \
                    --port 6090 \
                    --path /audio \
                    --device android_sink \
                    --sample-rate 48000 \
                    --channels 2 \
                    --bitrate 64000 \
                    --latency 20000 \
                    --codec opus
                ) >/tmp/audio-server.log 2>&1 &
                AUDIO_PID=$!

                sleep 3

                if kill -0 "$AUDIO_PID" 2>/dev/null; then
                  echo "Audio server process started."
                  cat /tmp/audio-server.log
                else
                  echo "WARNING: Audio server failed to start."
                  cat /tmp/audio-server.log
                  AUDIO_ENABLED=0
                  AUDIO_PID=""
                fi
              else
                echo "WARNING: Audio server build failed."
                AUDIO_ENABLED=0
              fi
            else
              echo "WARNING: Could not download audio server."
              AUDIO_ENABLED=0
            fi
          fi

          echo "STEP 8: Preparing Android SDK..."

          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null \
            | sort -V | tail -n 1 || true)"

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: Android sdkmanager was not found."
            echo "ANDROID_HOME=$ANDROID_HOME"
            exit 1
          fi

          AVDMANAGER="$(dirname "$SDKMANAGER")/avdmanager"

          if [ ! -x "$AVDMANAGER" ]; then
            echo "ERROR: avdmanager was not found."
            exit 1
          fi

          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$(dirname "$SDKMANAGER"):$PATH"

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            --licenses >/dev/null 2>&1 || true

          echo "Installing Android 4.4 x86 image..."

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "emulator" \
            "platform-tools" \
            "platforms;android-19" \
            "system-images;android-19;default;x86"

          printf 'no\n' | "$AVDMANAGER" create avd \
            --force \
            --name kitkat \
            --package "system-images;android-19;default;x86"

          AVD_CONFIG="$HOME/.android/avd/kitkat.avd/config.ini"

          set_avd_property() {
            local key="$1"
            local value="$2"

            if grep -q "^${key}=" "$AVD_CONFIG"; then
              sed -i "s|^${key}=.*|${key}=${value}|" "$AVD_CONFIG"
            else
              printf '%s=%s\n' "$key" "$value" >> "$AVD_CONFIG"
            fi
          }

          # Performance and display settings.
          set_avd_property hw.lcd.width 360
          set_avd_property hw.lcd.height 640
          set_avd_property hw.lcd.density 160
          set_avd_property hw.cpu.ncore 2
          set_avd_property hw.ramSize 1536
          set_avd_property vm.heapSize 128
          set_avd_property hw.keyboard yes

          # Configure and create the virtual SD card.
          echo "Creating a 512 MB virtual SD card..."

          set_avd_property hw.sdCard yes
          set_avd_property sdcard.size 512M

          SDCARD_IMAGE="$HOME/.android/avd/kitkat.avd/sdcard.img"

          rm -f "$SDCARD_IMAGE"

          "$ANDROID_HOME/emulator/mksdcard" \
            -l KitKatSD 512M "$SDCARD_IMAGE"

          if [ ! -s "$SDCARD_IMAGE" ]; then
            echo "ERROR: Failed to create the SD card image."
            exit 1
          fi

          ls -lh "$SDCARD_IMAGE"
          echo "SD card image created successfully."

          echo "STEP 9: Checking hardware acceleration..."

          if [ -e /dev/kvm ]; then
            sudo chmod a+rw /dev/kvm 2>/dev/null || true
          fi

          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            ACCEL=on
            echo "KVM is available."
          else
            ACCEL=off
            echo "WARNING: KVM unavailable; emulation may be slow."
          fi

          adb start-server

          echo "STEP 10: Launching Android 4.4 with SD card..."

          if [ "$AUDIO_ENABLED" -eq 1 ]; then
            QEMU_AUDIO_DRV=pa emulator -avd kitkat \
              -sdcard "$SDCARD_IMAGE" \
              -port 5554 \
              -accel "$ACCEL" \
              -gpu swiftshader \
              -no-snapshot \
              -no-boot-anim \
              -verbose \
              >/tmp/android-emulator.log 2>&1 &
          else
            emulator -avd kitkat \
              -sdcard "$SDCARD_IMAGE" \
              -port 5554 \
              -accel "$ACCEL" \
              -gpu swiftshader \
              -no-snapshot \
              -no-boot-anim \
              -verbose \
              >/tmp/android-emulator.log 2>&1 &
          fi

          EMULATOR_PID=$!
          DEVICE_READY=0

          for i in $(seq 1 180); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "ERROR: Emulator exited unexpectedly."
              tail -n 200 /tmp/android-emulator.log
              exit 1
            fi

            if adb devices | grep -qE \
              '^emulator-5554[[:space:]]+device$'; then
              DEVICE_READY=1
              break
            fi

            sleep 2
          done

          if [ "$DEVICE_READY" -ne 1 ]; then
            echo "ERROR: Emulator did not connect to ADB."
            adb devices -l || true
            tail -n 200 /tmp/android-emulator.log
            exit 1
          fi

          echo "Waiting for Android to finish booting..."

          BOOTED=""

          for i in $(seq 1 180); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "ERROR: Emulator exited during boot."
              tail -n 200 /tmp/android-emulator.log
              exit 1
            fi

            BOOTED="$(adb -s emulator-5554 shell \
              getprop sys.boot_completed 2>/dev/null \
              | tr -d '\r' || true)"

            if [ "$BOOTED" = "1" ]; then
              break
            fi

            sleep 5
          done

          if [ "$BOOTED" != "1" ]; then
            echo "ERROR: Android failed to boot."
            tail -n 200 /tmp/android-emulator.log
            exit 1
          fi

          echo "Android has booted."
          echo "Checking SD card mount..."

          adb -s emulator-5554 shell \
            'ls -ld /sdcard /mnt/sdcard /storage/sdcard0 2>/dev/null || true'

          adb -s emulator-5554 shell \
            'mount | grep -Ei "sdcard|vfat" || true'

          echo "STEP 11: Installing APK files..."

          APK_DIR="$GITHUB_WORKSPACE/apks"
          APK_FILES=()

          if [ -d "$APK_DIR" ]; then
            while IFS= read -r -d '' APK; do
              APK_FILES+=("$APK")
            done < <(
              find "$APK_DIR" -maxdepth 1 \
                -type f -iname '*.apk' -print0 | sort -z
            )
          fi

          if [ "${#APK_FILES[@]}" -eq 0 ]; then
            echo "No APK files found in the apks folder."
          else
            echo "Found ${#APK_FILES[@]} APK file(s)."

            for APK in "${APK_FILES[@]}"; do
              echo "Installing $(basename "$APK")..."

              if adb -s emulator-5554 install -r "$APK"; then
                echo "Successfully installed $(basename "$APK")."
              else
                echo "WARNING: Failed to install $(basename "$APK")."
              fi
            done
          fi

          echo "STEP 12: Applying Android settings..."

          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell settings put system screen_off_timeout 2147483647

          echo ""
          echo "ANDROID 4.4 IS READY."
          echo "Browser link: $BROWSER_URL"
          echo "Virtual SD card: 512 MB"
          echo "Audio enabled: $AUDIO_ENABLED"
          echo "APK folder: apks/"
          echo "Click the browser page once to enable audio playback."
          echo "Keep this GitHub Actions workflow running."

          while kill -0 "$EMULATOR_PID" 2>/dev/null \
            && kill -0 "$TUNNEL_PID" 2>/dev/null; do

            if [ "$AUDIO_ENABLED" -eq 1 ] \
              && [ -n "$AUDIO_PID" ] \
              && ! kill -0 "$AUDIO_PID" 2>/dev/null; then
              echo "WARNING: Audio server stopped."
              cat /tmp/audio-server.log
              AUDIO_ENABLED=0
              AUDIO_PID=""
            fi

            sleep 30
          done

          echo "ERROR: Emulator or Cloudflare Tunnel stopped."
          tail -n 100 /tmp/android-emulator.log
          cat /tmp/cloudflared.log
