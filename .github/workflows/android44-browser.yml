
name: Android 4.4 Browser Emulator

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start Android 4.4 and browser tunnel
        shell: bash
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive

          echo "STEP 1: Checking configuration..."

          if [ -z "${VNC_PASSWORD:-}" ] || [ "${#VNC_PASSWORD}" -ne 8 ]; then
            echo "ERROR: Set repository secret VNC_PASSWORD to exactly 8 characters."
            exit 1
          fi

          echo "::add-mask::$VNC_PASSWORD"

          echo "STEP 2: Installing desktop dependencies..."

          sudo apt-get update
          sudo apt-get install -y \
            xvfb openbox x11vnc novnc websockify curl ca-certificates \
            libpulse0 libasound2 libnss3 libglu1-mesa \
            libx11-6 libxrender1 libxtst6 libxi6 libxrandr2 \
            libxcursor1 libxcomposite1 libxdamage1 libxfixes3 \
            libxkbcommon0 libxkbcommon-x11-0 libxcb-xinerama0

          echo "STEP 3: Starting virtual desktop..."

          export DISPLAY=:0

          Xvfb :0 -screen 0 800x900x24 \
            -ac -nolisten tcp +extension GLX +render -noreset \
            >/tmp/xvfb.log 2>&1 &
          XVFB_PID=$!

          sleep 2

          if ! kill -0 "$XVFB_PID" 2>/dev/null; then
            cat /tmp/xvfb.log
            echo "ERROR: Virtual display failed to start."
            exit 1
          fi

          openbox >/tmp/openbox.log 2>&1 &

          x11vnc -storepasswd "$VNC_PASSWORD" /tmp/vnc.pass \
            >/dev/null
          chmod 600 /tmp/vnc.pass

          x11vnc -display :0 -forever -shared \
            -localhost -rfbport 5900 \
            -rfbauth /tmp/vnc.pass \
            -wait 10 -defer 10 \
            >/tmp/x11vnc.log 2>&1 &
          VNC_PID=$!

          websockify --web=/usr/share/novnc \
            127.0.0.1:6080 127.0.0.1:5900 \
            >/tmp/novnc.log 2>&1 &
          WEBSOCKIFY_PID=$!

          echo "Checking noVNC..."

          HTTP_READY=0

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:6080/vnc.html \
              >/dev/null; then
              HTTP_READY=1
              break
            fi
            sleep 1
          done

          if [ "$HTTP_READY" -ne 1 ]; then
            echo "ERROR: noVNC did not start."
            cat /tmp/novnc.log
            cat /tmp/x11vnc.log
            exit 1
          fi

          echo "STEP 4: Installing Cloudflare Tunnel..."

          curl -fL --retry 3 \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb \
            -o /tmp/cloudflared.deb

          sudo dpkg -i /tmp/cloudflared.deb

          echo "STEP 5: Creating browser link..."
          echo "Waiting for Cloudflare to generate a URL..."

          : > /tmp/cloudflared.log

          cloudflared tunnel \
            --url http://127.0.0.1:6080 \
            --no-autoupdate \
            --loglevel info \
            >/tmp/cloudflared.log 2>&1 &
          TUNNEL_PID=$!

          # Show Cloudflare output in the live Actions logs.
          tail -n +1 -F /tmp/cloudflared.log &
          LOG_TAIL_PID=$!

          URL=""

          for i in $(seq 1 90); do
            URL="$(grep -Eo \
              'https://[[:alnum:]-]+\.trycloudflare\.com' \
              /tmp/cloudflared.log | head -n 1 || true)"

            if [ -n "$URL" ]; then
              break
            fi

            if ! kill -0 "$TUNNEL_PID" 2>/dev/null; then
              echo "ERROR: Cloudflare Tunnel stopped."
              cat /tmp/cloudflared.log
              exit 1
            fi

            sleep 2
          done

          if [ -z "$URL" ]; then
            echo "ERROR: Cloudflare URL was not detected."
            echo "Cloudflare output:"
            cat /tmp/cloudflared.log
            exit 1
          fi

          BROWSER_URL="${URL}/vnc.html?autoconnect=true&resize=scale&quality=5&compression=1"

          echo ""
          echo "================================================"
          echo "YOUR ANDROID 4.4 BROWSER LINK:"
          echo "$BROWSER_URL"
          echo "================================================"
          echo ""

          echo "::notice title=Android 4.4 Browser Link::$BROWSER_URL"

          echo "STEP 6: Preparing Android SDK..."

          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null \
            | sort -V | tail -n 1 || true)"

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            echo "ANDROID_HOME=$ANDROID_HOME"
            exit 1
          fi

          AVDMANAGER="$(dirname "$SDKMANAGER")/avdmanager"

          if [ ! -x "$AVDMANAGER" ]; then
            echo "ERROR: avdmanager was not found."
            exit 1
          fi

          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$(dirname "$SDKMANAGER"):$PATH"

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            --licenses >/dev/null 2>&1 || true

          echo "Installing Android 4.4 system image..."

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "emulator" \
            "platform-tools" \
            "platforms;android-19" \
            "system-images;android-19;default;x86"

          printf 'no\n' | "$AVDMANAGER" create avd \
            --force \
            --name kitkat \
            --package "system-images;android-19;default;x86"

          AVD_CONFIG="$HOME/.android/avd/kitkat.avd/config.ini"

          set_avd_property() {
            local key="$1"
            local value="$2"

            if grep -q "^${key}=" "$AVD_CONFIG"; then
              sed -i "s|^${key}=.*|${key}=${value}|" "$AVD_CONFIG"
            else
              printf '%s=%s\n' "$key" "$value" >> "$AVD_CONFIG"
            fi
          }

          # Reduce display and rendering overhead.
          set_avd_property hw.lcd.width 360
          set_avd_property hw.lcd.height 640
          set_avd_property hw.lcd.density 160
          set_avd_property hw.cpu.ncore 2
          set_avd_property hw.ramSize 1536
          set_avd_property vm.heapSize 128
          set_avd_property hw.keyboard yes

          echo "STEP 7: Checking hardware acceleration..."

          if [ -e /dev/kvm ]; then
            sudo chmod a+rw /dev/kvm 2>/dev/null || true
          fi

          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            ACCEL=on
            echo "KVM is available."
          else
            ACCEL=off
            export ANDROID_I_WANT_MY_TCG=yes
            echo "WARNING: KVM unavailable; software CPU emulation will be slow."
          fi

          adb start-server

          echo "STEP 8: Launching Android 4.4..."

          emulator -avd kitkat \
            -port 5554 \
            -accel "$ACCEL" \
            -gpu swiftshader \
            -no-snapshot \
            -noaudio \
            -no-boot-anim \
            -verbose \
            >/tmp/android-emulator.log 2>&1 &
          EMULATOR_PID=$!

          DEVICE_READY=0

          for i in $(seq 1 180); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "ERROR: Emulator exited unexpectedly."
              tail -n 200 /tmp/android-emulator.log
              exit 1
            fi

            if adb devices | grep -qE \
              '^emulator-5554[[:space:]]+device$'; then
              DEVICE_READY=1
              break
            fi

            sleep 2
          done

          if [ "$DEVICE_READY" -ne 1 ]; then
            echo "ERROR: Emulator did not connect to ADB."
            adb devices -l || true
            tail -n 200 /tmp/android-emulator.log
            exit 1
          fi

          echo "Waiting for Android to finish booting..."

          BOOTED=""

          for i in $(seq 1 180); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "ERROR: Emulator exited during boot."
              tail -n 200 /tmp/android-emulator.log
              exit 1
            fi

            BOOTED="$(adb -s emulator-5554 shell \
              getprop sys.boot_completed 2>/dev/null \
              | tr -d '\r' || true)"

            if [ "$BOOTED" = "1" ]; then
              break
            fi

            sleep 5
          done

          if [ "$BOOTED" != "1" ]; then
            echo "ERROR: Android did not finish booting."
            tail -n 200 /tmp/android-emulator.log
            exit 1
          fi

          echo "STEP 9: Installing APK files..."

          APK_DIR="$GITHUB_WORKSPACE/apks"
          APK_FILES=()

          if [ -d "$APK_DIR" ]; then
            while IFS= read -r -d '' APK; do
              APK_FILES+=("$APK")
            done < <(find "$APK_DIR" -maxdepth 1 \
              -type f -iname '*.apk' -print0 | sort -z)
          fi

          INSTALL_FAILURES=0

          if [ "${#APK_FILES[@]}" -eq 0 ]; then
            echo "No APK files found in the apks folder."
          else
            echo "Found ${#APK_FILES[@]} APK file(s)."

            for APK in "${APK_FILES[@]}"; do
              echo ""
              echo "Installing: $(basename "$APK")"

              if adb -s emulator-5554 install -r "$APK"; then
                echo "Successfully installed: $(basename "$APK")"
              else
                echo "WARNING: Installation failed: $(basename "$APK")"
                INSTALL_FAILURES=$((INSTALL_FAILURES + 1))
              fi
            done
          fi

          echo ""
          echo "APK installation attempts finished."
          echo "Failed APK installations: $INSTALL_FAILURES"

          # Disable animations for a snappier UI.
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell settings put system screen_off_timeout 2147483647

          echo ""
          echo "ANDROID 4.4 IS READY."
          echo "Browser link: $BROWSER_URL"
          echo "Keep this GitHub Actions workflow running."

          while kill -0 "$EMULATOR_PID" 2>/dev/null \
            && kill -0 "$TUNNEL_PID" 2>/dev/null; do
            sleep 30
          done

          echo "ERROR: Emulator or Cloudflare Tunnel stopped."
          tail -n 100 /tmp/android-emulator.log
          cat /tmp/cloudflared.log
          exit 1
