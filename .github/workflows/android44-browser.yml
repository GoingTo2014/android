
name: Android 4.4 Browser Emulator

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Start rooted Android 4.4 in browser
        shell: bash
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive

          if [ -z "${VNC_PASSWORD:-}" ] || [ "${#VNC_PASSWORD}" -ne 8 ]; then
            echo "ERROR: Configure VNC_PASSWORD as an 8-character Actions secret."
            exit 1
          fi

          echo "::add-mask::$VNC_PASSWORD"

          echo "STEP 1: Installing desktop and audio dependencies..."

          sudo apt-get update
          sudo apt-get install -y \
            xvfb openbox x11vnc websockify nginx curl ca-certificates git \
            libpulse0 pulseaudio pulseaudio-utils libasound2 \
            libnss3 libglu1-mesa libx11-6 libxrender1 libxtst6 \
            libxi6 libxrandr2 libxcursor1 libxcomposite1 \
            libxdamage1 libxfixes3 libxkbcommon0 \
            libxkbcommon-x11-0 libxcb-xinerama0 \
            build-essential python3 pkg-config libopus-dev

          npm install --global pnpm@10.17.0

          echo "STEP 2: Downloading Android root files..."

          git clone --depth 1 \
            https://github.com/peripheralmike/Root-Android-Emulator.git \
            /tmp/root-avd

          SU_BINARY="/tmp/root-avd/SuperSU/x86/su"
          SU_MANAGER="/tmp/root-avd/SuperSU/common/Superuser.apk"

          if [ ! -f "$SU_BINARY" ] || [ ! -f "$SU_MANAGER" ]; then
            echo "ERROR: Expected x86 SuperSU files were not found."
            find /tmp/root-avd/SuperSU -maxdepth 3 -type f | head -n 100
            exit 1
          fi

          echo "Found SuperSU x86 binary and manager APK."

          echo "STEP 3: Starting the virtual desktop..."

          export DISPLAY=:0

          Xvfb :0 -screen 0 800x900x24 \
            -ac -nolisten tcp +extension GLX +render -noreset \
            >/tmp/xvfb.log 2>&1 &
          XVFB_PID=$!

          sleep 2

          if ! kill -0 "$XVFB_PID" 2>/dev/null; then
            cat /tmp/xvfb.log
            exit 1
          fi

          openbox >/tmp/openbox.log 2>&1 &

          x11vnc -storepasswd "$VNC_PASSWORD" /tmp/vnc.pass \
            >/dev/null
          chmod 600 /tmp/vnc.pass

          x11vnc -display :0 -forever -shared \
            -localhost -rfbport 5900 \
            -rfbauth /tmp/vnc.pass -wait 10 -defer 10 \
            >/tmp/x11vnc.log 2>&1 &

          echo "STEP 4: Preparing audio-enabled noVNC..."

          git clone --depth 1 \
            https://github.com/babelcloud/noVNC.git \
            /tmp/babelcloud-novnc

          (
            cd /tmp/babelcloud-novnc
            bash ./build.sh

            if [ -f defaults.json ]; then
              cp defaults.json build/
            fi

            if [ -f mandatory.json ]; then
              cp mandatory.json build/
            fi
          )

          if [ ! -f /tmp/babelcloud-novnc/build/vnc.html ]; then
            echo "ERROR: noVNC build did not produce vnc.html."
            exit 1
          fi

          websockify 127.0.0.1:6081 127.0.0.1:5900 \
            >/tmp/websockify.log 2>&1 &

          echo "STEP 5: Configuring Nginx..."

          sudo tee /etc/nginx/conf.d/android44.conf >/dev/null <<'NGINX'
          server {
              listen 127.0.0.1:6080;
              server_name _;

              root /tmp/babelcloud-novnc/build;
              index vnc.html;

              location /websockify {
                  proxy_pass http://127.0.0.1:6081;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_read_timeout 3600s;
                  proxy_send_timeout 3600s;
                  proxy_buffering off;
              }

              location = /audio {
                  proxy_pass http://127.0.0.1:6090/audio;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_read_timeout 3600s;
                  proxy_send_timeout 3600s;
                  proxy_buffering off;
              }

              location / {
                  try_files $uri $uri/ =404;
              }
          }
          NGINX

          sudo nginx -t
          sudo service nginx restart

          echo "Checking the noVNC page..."

          HTTP_READY=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:6080/vnc.html >/dev/null; then
              HTTP_READY=1
              break
            fi
            sleep 1
          done

          if [ "$HTTP_READY" -ne 1 ]; then
            echo "ERROR: noVNC is unavailable."
            cat /tmp/websockify.log
            exit 1
          fi

          echo "STEP 6: Creating the Cloudflare browser link..."

          curl -fL --retry 3 \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb \
            -o /tmp/cloudflared.deb

          sudo dpkg -i /tmp/cloudflared.deb

          cloudflared tunnel \
            --url http://127.0.0.1:6080 \
            --no-autoupdate \
            --loglevel info \
            >/tmp/cloudflared.log 2>&1 &
          TUNNEL_PID=$!

          tail -n +1 -F /tmp/cloudflared.log &
          LOG_TAIL_PID=$!

          URL=""

          for i in $(seq 1 90); do
            URL="$(grep -Eo \
              'https://[[:alnum:]-]+\.trycloudflare\.com' \
              /tmp/cloudflared.log | head -n 1 || true)"

            if [ -n "$URL" ]; then
              break
            fi

            if ! kill -0 "$TUNNEL_PID" 2>/dev/null; then
              echo "ERROR: Cloudflare Tunnel exited."
              cat /tmp/cloudflared.log
              exit 1
            fi

            sleep 2
          done

          if [ -z "$URL" ]; then
            echo "ERROR: Cloudflare did not generate a URL."
            cat /tmp/cloudflared.log
            exit 1
          fi

          BROWSER_URL="${URL}/vnc.html#autoconnect=true&path=websockify&resize=scale&quality=5&compression=1"

          echo ""
          echo "================================================"
          echo "YOUR ANDROID 4.4 BROWSER LINK:"
          echo "$BROWSER_URL"
          echo "================================================"
          echo ""

          echo "::notice title=ANDROID 4.4 BROWSER LINK::$BROWSER_URL"

          echo "STEP 7: Preparing the Android SDK..."

          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null \
            | sort -V | tail -n 1 || true)"

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: Android sdkmanager was not found."
            echo "ANDROID_HOME=$ANDROID_HOME"
            exit 1
          fi

          AVDMANAGER="$(dirname "$SDKMANAGER")/avdmanager"

          if [ ! -x "$AVDMANAGER" ]; then
            echo "ERROR: avdmanager was not found."
            exit 1
          fi

          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$(dirname "$SDKMANAGER"):$PATH"

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            --licenses >/dev/null 2>&1 || true

          echo "Installing Android 4.4 x86..."

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "emulator" \
            "platform-tools" \
            "platforms;android-19" \
            "system-images;android-19;default;x86"

          printf 'no\n' | "$AVDMANAGER" create avd \
            --force \
            --name kitkat \
            --package "system-images;android-19;default;x86"

          AVD_CONFIG="$HOME/.android/avd/kitkat.avd/config.ini"

          set_avd_property() {
            local key="$1"
            local value="$2"

            if grep -q "^${key}=" "$AVD_CONFIG"; then
              sed -i "s|^${key}=.*|${key}=${value}|" "$AVD_CONFIG"
            else
              printf '%s=%s\n' "$key" "$value" >> "$AVD_CONFIG"
            fi
          }

          echo "STEP 8: Configuring the virtual SD card..."

          set_avd_property hw.lcd.width 360
          set_avd_property hw.lcd.height 640
          set_avd_property hw.lcd.density 160
          set_avd_property hw.cpu.ncore 2
          set_avd_property hw.ramSize 1536
          set_avd_property vm.heapSize 128
          set_avd_property hw.keyboard yes
          set_avd_property hw.sdCard yes
          set_avd_property sdcard.size 512M

          SDCARD_IMAGE="$HOME/.android/avd/kitkat.avd/sdcard.img"

          rm -f "$SDCARD_IMAGE"

          "$ANDROID_HOME/emulator/mksdcard" \
            -l KitKatSD 512M "$SDCARD_IMAGE"

          if [ ! -s "$SDCARD_IMAGE" ]; then
            echo "ERROR: Failed to create SD card."
            exit 1
          fi

          ls -lh "$SDCARD_IMAGE"

          echo "STEP 9: Checking hardware acceleration..."

          if [ -e /dev/kvm ]; then
            sudo chmod a+rw /dev/kvm 2>/dev/null || true
          fi

          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            ACCEL=on
            echo "KVM is available."
          else
            ACCEL=off
            echo "WARNING: KVM unavailable; emulation may be slow."
          fi

          echo "STEP 10: Setting up PulseAudio..."

          AUDIO_ENABLED=1
          AUDIO_PID=""

          export XDG_RUNTIME_DIR="/tmp/runtime-${UID}"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          export PULSE_SERVER="unix:${XDG_RUNTIME_DIR}/pulse/native"

          if pulseaudio \
            --daemonize=yes \
            --exit-idle-time=-1 \
            --log-target=file:/tmp/pulseaudio.log; then

            PULSE_READY=0

            for i in $(seq 1 20); do
              if pactl info >/dev/null 2>&1; then
                PULSE_READY=1
                break
              fi
              sleep 1
            done

            if [ "$PULSE_READY" -eq 1 ]; then
              if pactl load-module module-null-sink \
                sink_name=android_sink \
                sink_properties=device.description=AndroidAudioSink \
                rate=48000 channels=2; then
                pactl set-default-sink android_sink
                echo "PulseAudio sink created."
              else
                echo "WARNING: Audio sink creation failed."
                AUDIO_ENABLED=0
              fi
            else
              echo "WARNING: PulseAudio did not start."
              cat /tmp/pulseaudio.log || true
              AUDIO_ENABLED=0
            fi
          else
            echo "WARNING: PulseAudio failed."
            AUDIO_ENABLED=0
          fi

          echo "STEP 11: Building the audio server..."

          if [ "$AUDIO_ENABLED" -eq 1 ]; then
            if git clone --depth 1 \
              https://github.com/babelcloud/novnc-audio-server.git \
              /tmp/novnc-audio-server; then

              if (
                cd /tmp/novnc-audio-server
                pnpm install --no-frozen-lockfile
                pnpm run build
              ); then

                (
                  cd /tmp/novnc-audio-server
                  exec node dist/main.js \
                    --host 127.0.0.1 \
                    --port 6090 \
                    --path /audio \
                    --device android_sink \
                    --sample-rate 48000 \
                    --channels 2 \
                    --bitrate 64000 \
                    --latency 20000 \
                    --codec opus
                ) >/tmp/audio-server.log 2>&1 &
                AUDIO_PID=$!

                sleep 3

                if kill -0 "$AUDIO_PID" 2>/dev/null; then
                  echo "Audio server started."
                  cat /tmp/audio-server.log
                else
                  echo "WARNING: Audio server failed to start."
                  cat /tmp/audio-server.log
                  AUDIO_ENABLED=0
                  AUDIO_PID=""
                fi
              else
                echo "WARNING: Audio build failed; continuing without audio."
                AUDIO_ENABLED=0
              fi
            else
              echo "WARNING: Audio server download failed."
              AUDIO_ENABLED=0
            fi
          fi

          echo "STEP 12: Starting Android 4.4..."

          adb start-server

          if [ "$AUDIO_ENABLED" -eq 1 ]; then
            export QEMU_AUDIO_DRV=pa
          fi

          emulator -avd kitkat \
            -writable-system \
            -selinux disabled \
            -sdcard "$SDCARD_IMAGE" \
            -port 5554 \
            -accel "$ACCEL" \
            -gpu swiftshader \
            -no-snapshot \
            -no-boot-anim \
            -verbose \
            >/tmp/android-emulator.log 2>&1 &
          EMULATOR_PID=$!

          DEVICE_READY=0

          for i in $(seq 1 180); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "ERROR: Emulator process exited."
              tail -n 200 /tmp/android-emulator.log
              exit 1
            fi

            if adb devices | grep -qE \
              '^emulator-5554[[:space:]]+device$'; then
              DEVICE_READY=1
              break
            fi

            sleep 2
          done

          if [ "$DEVICE_READY" -ne 1 ]; then
            echo "ERROR: Emulator did not connect to ADB."
            adb devices -l || true
            tail -n 200 /tmp/android-emulator.log
            exit 1
          fi

          echo "Waiting for Android to boot..."

          BOOTED=""

          for i in $(seq 1 180); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "ERROR: Emulator exited during boot."
              tail -n 200 /tmp/android-emulator.log
              exit 1
            fi

            BOOTED="$(adb -s emulator-5554 shell \
              getprop sys.boot_completed 2>/dev/null \
              | tr -d '\r' || true)"

            if [ "$BOOTED" = "1" ]; then
              break
            fi

            sleep 5
          done

          if [ "$BOOTED" != "1" ]; then
            echo "ERROR: Android failed to boot."
            tail -n 200 /tmp/android-emulator.log
            exit 1
          fi

          echo "STEP 13: Installing application root access..."

          adb -s emulator-5554 root
          adb -s emulator-5554 wait-for-device

          ADB_ROOT_OK=0

          for i in $(seq 1 20); do
            ROOT_ID="$(adb -s emulator-5554 shell id 2>/dev/null \
              | tr -d '\r' || true)"

            echo "$ROOT_ID"

            if [[ "$ROOT_ID" == *"uid=0(root)"* ]]; then
              ADB_ROOT_OK=1
              break
            fi

            sleep 1
          done

          if [ "$ADB_ROOT_OK" -ne 1 ]; then
            echo "ERROR: ADB root is unavailable."
            exit 1
          fi

          adb -s emulator-5554 remount

          echo "Installing SuperSU manager..."

          adb -s emulator-5554 install -r "$SU_MANAGER"

          echo "Copying x86 su binary into /system..."

          adb -s emulator-5554 push \
            "$SU_BINARY" /system/xbin/su

          adb -s emulator-5554 shell \
            chown 0:0 /system/xbin/su

          adb -s emulator-5554 shell \
            chmod 0755 /system/xbin/su

          adb -s emulator-5554 shell \
            setenforce 0 || true

          echo "Initializing SuperSU..."

          adb -s emulator-5554 shell \
            /system/xbin/su --install || true

          adb -s emulator-5554 shell \
            "su --daemon >/dev/null 2>&1 &" || true

          if adb -s emulator-5554 shell \
            'test -x /system/xbin/su'; then
            echo "SU_INSTALLED=1"
          else
            echo "ERROR: su binary installation failed."
            exit 1
          fi

          adb -s emulator-5554 shell \
            ls -l /system/xbin/su

          echo "STEP 14: Checking SD card mount..."

          adb -s emulator-5554 shell \
            'ls -ld /sdcard /mnt/sdcard /storage/sdcard0 2>/dev/null || true'

          adb -s emulator-5554 shell \
            'mount | grep -Ei "sdcard|vfat" || true'

          echo "STEP 15: Installing APKs from apks/..."

          APK_DIR="$GITHUB_WORKSPACE/apks"
          APK_FILES=()

          if [ -d "$APK_DIR" ]; then
            while IFS= read -r -d '' APK; do
              APK_FILES+=("$APK")
            done < <(
              find "$APK_DIR" -maxdepth 1 \
                -type f -iname '*.apk' -print0 | sort -z
            )
          fi

          if [ "${#APK_FILES[@]}" -eq 0 ]; then
            echo "No APK files found in apks/."
          else
            echo "Found ${#APK_FILES[@]} APK file(s)."

            for APK in "${APK_FILES[@]}"; do
              echo "Installing $(basename "$APK")..."

              if adb -s emulator-5554 install -r "$APK"; then
                echo "Installed $(basename "$APK")."
              else
                echo "WARNING: Failed to install $(basename "$APK")."
              fi
            done
          fi

          echo "STEP 16: Applying performance settings..."

          adb -s emulator-5554 shell \
            settings put global window_animation_scale 0

          adb -s emulator-5554 shell \
            settings put global transition_animation_scale 0

          adb -s emulator-5554 shell \
            settings put global animator_duration_scale 0

          adb -s emulator-5554 shell \
            settings put system screen_off_timeout 2147483647

          echo ""
          echo "================================================"
          echo "ANDROID 4.4 IS READY"
          echo "YOUR ANDROID 4.4 BROWSER LINK:"
          echo "$BROWSER_URL"
          echo "ADB ROOT: $ADB_ROOT_OK"
          echo "SU INSTALLED: 1"
          echo "SD CARD: 512 MB"
          echo "AUDIO ENABLED: $AUDIO_ENABLED"
          echo "APK DIRECTORY: apks/"
          echo "================================================"

          while kill -0 "$EMULATOR_PID" 2>/dev/null \
            && kill -0 "$TUNNEL_PID" 2>/dev/null; do

            if [ "$AUDIO_ENABLED" -eq 1 ] \
              && [ -n "$AUDIO_PID" ] \
              && ! kill -0 "$AUDIO_PID" 2>/dev/null; then
              echo "WARNING: Audio server stopped."
              cat /tmp/audio-server.log
              AUDIO_ENABLED=0
              AUDIO_PID=""
            fi

            sleep 30
          done

          echo "ERROR: Emulator or Cloudflare Tunnel stopped."
          tail -n 100 /tmp/android-emulator.log
          cat /tmp/cloudflared.log
