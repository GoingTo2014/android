
name: Android 4.4 Browser Emulator

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Start optimized Android 4.4 session
        shell: bash
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive

          if [ -z "${VNC_PASSWORD:-}" ] || [ "${#VNC_PASSWORD}" -ne 8 ]; then
            echo "Set VNC_PASSWORD to an 8-character repository secret."
            exit 1
          fi

          echo "::add-mask::$VNC_PASSWORD"

          echo "Installing desktop dependencies..."

          sudo apt-get update
          sudo apt-get install -y \
            xvfb openbox x11vnc novnc websockify curl ca-certificates \
            libpulse0 libasound2 libnss3 libglu1-mesa \
            libx11-6 libxrender1 libxtst6 libxi6 libxrandr2 \
            libxcursor1 libxcomposite1 libxdamage1 libxfixes3 \
            libxkbcommon0 libxkbcommon-x11-0 libxcb-xinerama0

          export DISPLAY=:0

          # Smaller virtual desktop means fewer pixels to transmit.
          Xvfb :0 -screen 0 800x900x24 \
            -ac -nolisten tcp +extension GLX +render -noreset \
            >/tmp/xvfb.log 2>&1 &
          XVFB_PID=$!

          sleep 2

          if ! kill -0 "$XVFB_PID" 2>/dev/null; then
            cat /tmp/xvfb.log
            exit 1
          fi

          openbox >/tmp/openbox.log 2>&1 &

          x11vnc -storepasswd "$VNC_PASSWORD" /tmp/vnc.pass \
            >/dev/null
          chmod 600 /tmp/vnc.pass

          # More frequent screen updates for interactive use.
          x11vnc -display :0 -forever -shared \
            -localhost -rfbport 5900 -rfbauth /tmp/vnc.pass \
            -wait 10 -defer 10 -wait_ui 2 \
            >/tmp/x11vnc.log 2>&1 &

          websockify --web=/usr/share/novnc \
            127.0.0.1:6080 127.0.0.1:5900 \
            >/tmp/novnc.log 2>&1 &

          echo "Installing Cloudflare Tunnel..."

          curl -fL --retry 3 \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb \
            -o /tmp/cloudflared.deb

          sudo dpkg -i /tmp/cloudflared.deb

          cloudflared tunnel \
            --url http://127.0.0.1:6080 \
            --no-autoupdate \
            >/tmp/cloudflared.log 2>&1 &
          CLOUDFLARED_PID=$!

          URL=""

          for i in $(seq 1 90); do
            URL="$(grep -Eo \
              'https://[[:alnum:]-]+\.trycloudflare\.com' \
              /tmp/cloudflared.log | head -n 1 || true)"

            if [ -n "$URL" ]; then
              break
            fi

            if ! kill -0 "$CLOUDFLARED_PID" 2>/dev/null; then
              cat /tmp/cloudflared.log
              exit 1
            fi

            sleep 2
          done

          if [ -z "$URL" ]; then
            echo "Could not create the Cloudflare URL."
            cat /tmp/cloudflared.log
            exit 1
          fi

          BROWSER_URL="${URL}/vnc.html#autoconnect=1&resize=scale&quality=5&compression=1"

          echo ""
          echo "============================================"
          echo "ANDROID 4.4 BROWSER LINK:"
          echo "$BROWSER_URL"
          echo "============================================"
          echo ""

          echo "::notice title=Android Browser Link::$BROWSER_URL"

          {
            echo "## Android 4.4 Browser Emulator"
            echo ""
            echo "Browser link: $BROWSER_URL"
            echo ""
            echo "The Android emulator is starting. Keep this job running."
          } >> "$GITHUB_STEP_SUMMARY"

          # Locate Android SDK tools.
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null \
            | sort -V | tail -n 1 || true)"

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "Android SDK command-line tools not found."
            exit 1
          fi

          AVDMANAGER="$(dirname "$SDKMANAGER")/avdmanager"

          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$(dirname "$SDKMANAGER"):$PATH"

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            --licenses >/dev/null 2>&1 || true

          echo "Installing Android 4.4 system image..."

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "emulator" \
            "platform-tools" \
            "platforms;android-19" \
            "system-images;android-19;default;x86"

          printf 'no\n' | "$AVDMANAGER" create avd \
            --force \
            --name kitkat \
            --package "system-images;android-19;default;x86"

          AVD_CONFIG="$HOME/.android/avd/kitkat.avd/config.ini"

          set_avd_property() {
            local key="$1"
            local value="$2"

            if grep -q "^${key}=" "$AVD_CONFIG"; then
              sed -i "s|^${key}=.*|${key}=${value}|" "$AVD_CONFIG"
            else
              printf '%s=%s\n' "$key" "$value" >> "$AVD_CONFIG"
            fi
          }

          # Lower resolution: faster rendering and less VNC traffic.
          set_avd_property hw.lcd.width 360
          set_avd_property hw.lcd.height 640
          set_avd_property hw.lcd.density 160
          set_avd_property hw.cpu.ncore 2
          set_avd_property hw.ramSize 1024
          set_avd_property vm.heapSize 128

          echo "Checking hardware virtualization..."

          if [ -e /dev/kvm ]; then
            sudo chmod a+rw /dev/kvm 2>/dev/null || true
          fi

          "$ANDROID_HOME/emulator/emulator" -accel-check || true

          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            ACCEL=on
            echo "KVM available: hardware-accelerated CPU emulation."
          else
            ACCEL=off
            export ANDROID_I_WANT_MY_TCG=yes
            echo "WARNING: KVM unavailable; Android will run much slower."
          fi

          adb start-server

          echo "Launching Android 4.4..."

          emulator -avd kitkat \
            -port 5554 \
            -accel "$ACCEL" \
            -gpu swiftshader \
            -no-snapshot \
            -noaudio \
            -no-boot-anim \
            >/tmp/android-emulator.log 2>&1 &
          EMULATOR_PID=$!

          DEVICE_READY=0

          for i in $(seq 1 180); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "Emulator exited unexpectedly."
              tail -n 200 /tmp/android-emulator.log
              exit 1
            fi

            if adb devices | grep -qE \
              '^emulator-5554[[:space:]]+device$'; then
              DEVICE_READY=1
              break
            fi

            sleep 2
          done

          if [ "$DEVICE_READY" -ne 1 ]; then
            echo "Emulator did not connect to ADB."
            adb devices -l || true
            tail -n 200 /tmp/android-emulator.log
            exit 1
          fi

          echo "Waiting for Android to finish booting..."

          BOOTED=""

          for i in $(seq 1 180); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "Emulator exited during boot."
              tail -n 200 /tmp/android-emulator.log
              exit 1
            fi

            BOOTED="$(adb -s emulator-5554 shell \
              getprop sys.boot_completed 2>/dev/null \
              | tr -d '\r' || true)"

            if [ "$BOOTED" = "1" ]; then
              break
            fi

            sleep 5
          done

          if [ "$BOOTED" != "1" ]; then
            echo "Android failed to finish booting."
            tail -n 200 /tmp/android-emulator.log
            exit 1
          fi

          # Remove transition animations to make the UI feel snappier.
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell settings put system screen_off_timeout 2147483647

          echo "Android 4.4 is ready."
          echo "Use the browser link printed above."

          while kill -0 "$EMULATOR_PID" 2>/dev/null \
            && kill -0 "$CLOUDFLARED_PID" 2>/dev/null; do
            sleep 30
          done

          echo "The emulator or tunnel stopped."
          tail -n 100 /tmp/android-emulator.log
          cat /tmp/cloudflared.log
          exit 1
