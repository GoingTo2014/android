
name: Android 4.4 Browser Emulator

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Set up remote desktop and tunnel
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          set -euo pipefail

          if [ "${#VNC_PASSWORD}" -ne 8 ]; then
            echo "Set VNC_PASSWORD to exactly 8 characters."
            exit 1
          fi

          echo "::add-mask::$VNC_PASSWORD"

          sudo apt-get update
          sudo apt-get install -y \
            xvfb openbox x11vnc novnc websockify curl

          # Create a virtual desktop.
          Xvfb :0 -screen 0 1280x800x24 \
            -ac -nolisten tcp +extension GLX +render \
            -noreset >/tmp/xvfb.log 2>&1 &
          sleep 2

          DISPLAY=:0 openbox >/tmp/openbox.log 2>&1 &

          # Protect the VNC desktop with a password.
          x11vnc -storepasswd "$VNC_PASSWORD" /tmp/vnc.pass \
            >/dev/null
          chmod 600 /tmp/vnc.pass

          x11vnc -display :0 -forever -shared \
            -localhost -rfbport 5900 \
            -rfbauth /tmp/vnc.pass \
            >/tmp/x11vnc.log 2>&1 &

          # Serve noVNC locally.
          websockify --web=/usr/share/novnc \
            127.0.0.1:6080 127.0.0.1:5900 \
            >/tmp/novnc.log 2>&1 &

          # Install Cloudflare Tunnel.
          curl -fL \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb \
            -o /tmp/cloudflared.deb
          sudo dpkg -i /tmp/cloudflared.deb

          cloudflared tunnel \
            --url http://127.0.0.1:6080 \
            --no-autoupdate \
            >/tmp/cloudflared.log 2>&1 &

          # Wait for the public browser URL.
          URL=""
          for i in $(seq 1 60); do
            URL="$(grep -Eo \
              'https://[a-zA-Z0-9-]+\.trycloudflare\.com' \
              /tmp/cloudflared.log | head -n 1 || true)"
            if [ -n "$URL" ]; then
              break
            fi
            sleep 2
          done

          if [ -z "$URL" ]; then
            cat /tmp/cloudflared.log
            echo "Could not create the tunnel."
            exit 1
          fi

          echo "$URL" > /tmp/android44-url

          {
            echo "## Android 4.4 Emulator"
            echo "[Open Android in your browser]($URL/vnc.html?autoconnect=1&resize=remote)"
            echo ""
            echo "Enter your VNC_PASSWORD when prompted."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Boot Android 4.4
        uses: reactivecircus/android-emulator-runner@v2
        env:
          DISPLAY: ":0"
        with:
          api-level: 19
          target: default
          arch: x86
          emulator-boot-timeout: 900
          emulator-options: >-
            -gpu swiftshader_indirect
            -no-snapshot
            -noaudio
            -no-boot-anim
          script: |
            echo "Android is running."
            # Keep the session available for browser interaction.
            while true; do sleep 60; done
