
name: Android 4.4 Browser Emulator

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Start Android 4.4 with diagnostics
        shell: bash
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive

          if [ -z "${VNC_PASSWORD:-}" ] || [ "${#VNC_PASSWORD}" -ne 8 ]; then
            echo "ERROR: Configure VNC_PASSWORD as an 8-character repository secret."
            exit 1
          fi

          echo "::add-mask::$VNC_PASSWORD"

          echo "STEP 1: Installing dependencies..."

          sudo apt-get update
          sudo apt-get install -y \
            xvfb openbox x11vnc websockify nginx curl ca-certificates git \
            libpulse0 pulseaudio pulseaudio-utils libasound2 \
            libnss3 libglu1-mesa libx11-6 libxrender1 libxtst6 \
            libxi6 libxrandr2 libxcursor1 libxcomposite1 \
            libxdamage1 libxfixes3 libxkbcommon0 \
            libxkbcommon-x11-0 libxcb-xinerama0 \
            build-essential python3 pkg-config libopus-dev \
            unzip pciutils x11-utils

          npm install --global pnpm@10.17.0

          echo "STEP 2: Downloading SuperSU files..."

          ROOT_FILES_OK=0

          if git clone --depth 1 \
            https://github.com/peripheralmike/Root-Android-Emulator.git \
            /tmp/root-avd; then

            SU_BINARY="/tmp/root-avd/SuperSU/x86/su"
            SU_MANAGER="/tmp/root-avd/SuperSU/common/Superuser.apk"

            if [ -f "$SU_BINARY" ] && [ -f "$SU_MANAGER" ]; then
              ROOT_FILES_OK=1
              echo "SuperSU x86 files found."
            else
              echo "WARNING: Expected SuperSU files were not found."
            fi
          else
            echo "WARNING: Could not download SuperSU files."
          fi

          echo "STEP 3: Starting virtual desktop..."

          export DISPLAY=:0

          Xvfb :0 -screen 0 800x900x24 \
            -ac -nolisten tcp +extension GLX +render -noreset \
            >/tmp/xvfb.log 2>&1 &
          XVFB_PID=$!

          sleep 2

          if ! kill -0 "$XVFB_PID" 2>/dev/null; then
            cat /tmp/xvfb.log
            echo "ERROR: Xvfb failed to start."
            exit 1
          fi

          openbox >/tmp/openbox.log 2>&1 &

          x11vnc -storepasswd "$VNC_PASSWORD" /tmp/vnc.pass \
            >/dev/null
          chmod 600 /tmp/vnc.pass

          x11vnc -display :0 -forever -shared \
            -localhost -rfbport 5900 \
            -rfbauth /tmp/vnc.pass \
            -wait 10 -defer 10 \
            >/tmp/x11vnc.log 2>&1 &
          VNC_PID=$!

          echo "STEP 4: Building noVNC..."

          git clone --depth 1 \
            https://github.com/babelcloud/noVNC.git \
            /tmp/babelcloud-novnc

          (
            cd /tmp/babelcloud-novnc

            # The current fork uses build.sh, not pnpm run build.
            bash ./build.sh

            for file in defaults.json mandatory.json; do
              if [ -f "$file" ]; then
                cp "$file" build/
              fi
            done
          )

          if [ ! -f /tmp/babelcloud-novnc/build/vnc.html ]; then
            echo "ERROR: noVNC build failed."
            exit 1
          fi

          echo "noVNC build completed."

          echo "STEP 5: Starting WebSocket proxy..."

          websockify 127.0.0.1:6081 127.0.0.1:5900 \
            >/tmp/websockify.log 2>&1 &
          WEBSOCKIFY_PID=$!

          sleep 2

          if ! kill -0 "$WEBSOCKIFY_PID" 2>/dev/null; then
            cat /tmp/websockify.log
            exit 1
          fi

          echo "STEP 6: Configuring Nginx..."

          sudo tee /etc/nginx/conf.d/android44.conf >/dev/null <<'NGINX'
          server {
              listen 127.0.0.1:6080;
              server_name _;

              root /tmp/babelcloud-novnc/build;
              index vnc.html;

              location = /websockify {
                  proxy_pass http://127.0.0.1:6081;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_read_timeout 3600s;
                  proxy_send_timeout 3600s;
                  proxy_buffering off;
              }

              location = /vnc.html/ws {
                  proxy_pass http://127.0.0.1:6081;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_read_timeout 3600s;
                  proxy_send_timeout 3600s;
                  proxy_buffering off;
              }

              location = /audio {
                  proxy_pass http://127.0.0.1:6090/audio;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_read_timeout 3600s;
                  proxy_send_timeout 3600s;
                  proxy_buffering off;
              }

              location / {
                  add_header Cache-Control "no-cache" always;
                  try_files $uri $uri/ =404;
              }
          }
          NGINX

          sudo nginx -t
          sudo service nginx restart

          echo "Checking local browser page..."

          HTTP_READY=0

          for i in $(seq 1 30); do
            if curl -fsS \
              http://127.0.0.1:6080/vnc.html >/dev/null; then
              HTTP_READY=1
              break
            fi
            sleep 1
          done

          if [ "$HTTP_READY" -ne 1 ]; then
            echo "ERROR: noVNC page is unavailable."
            cat /tmp/websockify.log
            exit 1
          fi

          echo "Local noVNC page is responding."

          echo "STEP 7: Creating Cloudflare tunnel..."

          curl -fL --retry 3 \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb \
            -o /tmp/cloudflared.deb

          sudo dpkg -i /tmp/cloudflared.deb

          cloudflared tunnel \
            --url http://127.0.0.1:6080 \
            --no-autoupdate \
            --loglevel info \
            >/tmp/cloudflared.log 2>&1 &
          TUNNEL_PID=$!

          tail -n +1 -F /tmp/cloudflared.log &
          LOG_TAIL_PID=$!

          URL=""

          for i in $(seq 1 90); do
            URL="$(grep -Eo \
              'https://[[:alnum:]-]+\.trycloudflare\.com' \
              /tmp/cloudflared.log | head -n 1 || true)"

            if [ -n "$URL" ]; then
              break
            fi

            if ! kill -0 "$TUNNEL_PID" 2>/dev/null; then
              echo "ERROR: Cloudflare Tunnel exited."
              cat /tmp/cloudflared.log
              exit 1
            fi

            sleep 2
          done

          if [ -z "$URL" ]; then
            echo "ERROR: Cloudflare URL was not generated."
            cat /tmp/cloudflared.log
            exit 1
          fi

          HOST="${URL#https://}"

          BROWSER_URL="${URL}/vnc.html?host=${HOST}&port=443&encrypt=true&autoconnect=true&path=websockify&resize=scale&quality=5&compression=1"

          echo ""
          echo "================================================"
          echo "YOUR ANDROID 4.4 BROWSER LINK:"
          echo "$BROWSER_URL"
          echo "================================================"
          echo ""

          echo "::notice title=ANDROID 4.4 BROWSER LINK::$BROWSER_URL"

          {
            echo "## Android 4.4 Browser Emulator"
            echo ""
            echo "**Browser link:** $BROWSER_URL"
            echo ""
            echo "Use the live Actions logs if the job is still running."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "STEP 8: Preparing Android SDK..."

          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null \
            | sort -V | tail -n 1 || true)"

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager was not found."
            echo "ANDROID_HOME=$ANDROID_HOME"
            exit 1
          fi

          AVDMANAGER="$(dirname "$SDKMANAGER")/avdmanager"

          if [ ! -x "$AVDMANAGER" ]; then
            echo "ERROR: avdmanager was not found."
            exit 1
          fi

          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$(dirname "$SDKMANAGER"):$PATH"

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            --licenses >/dev/null 2>&1 || true

          echo "Installing Android 4.4 x86 image..."

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "emulator" \
            "platform-tools" \
            "platforms;android-19" \
            "system-images;android-19;default;x86"

          printf 'no\n' | "$AVDMANAGER" create avd \
            --force \
            --name kitkat \
            --package "system-images;android-19;default;x86"

          AVD_CONFIG="$HOME/.android/avd/kitkat.avd/config.ini"

          set_avd_property() {
            local key="$1"
            local value="$2"

            if grep -q "^${key}=" "$AVD_CONFIG"; then
              sed -i "s|^${key}=.*|${key}=${value}|" "$AVD_CONFIG"
            else
              printf '%s=%s\n' "$key" "$value" >> "$AVD_CONFIG"
            fi
          }

          echo "STEP 9: Configuring Android and virtual SD card..."

          set_avd_property hw.lcd.width 360
          set_avd_property hw.lcd.height 640
          set_avd_property hw.lcd.density 160
          set_avd_property hw.cpu.ncore 2
          set_avd_property hw.ramSize 1536
          set_avd_property vm.heapSize 128
          set_avd_property hw.keyboard yes
          set_avd_property hw.sdCard yes
          set_avd_property sdcard.size 512M

          SDCARD_IMAGE="$HOME/.android/avd/kitkat.avd/sdcard.img"

          rm -f "$SDCARD_IMAGE"

          "$ANDROID_HOME/emulator/mksdcard" \
            -l KitKatSD 512M "$SDCARD_IMAGE"

          if [ ! -s "$SDCARD_IMAGE" ]; then
            echo "ERROR: Could not create virtual SD card."
            exit 1
          fi

          ls -lh "$SDCARD_IMAGE"

          echo "STEP 10: Checking CPU virtualization..."

          if [ -e /dev/kvm ]; then
            sudo chmod a+rw /dev/kvm 2>/dev/null || true
          fi

          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            ACCEL=on
            echo "KVM is available."
          else
            ACCEL=off
            echo "WARNING: KVM is unavailable."
          fi

          GPU_MODE="swiftshader"

          "$ANDROID_HOME/emulator/emulator" -accel-check 2>&1 || true

          echo "STEP 11: Setting up PulseAudio..."

          AUDIO_ENABLED=1
          AUDIO_PID=""

          export XDG_RUNTIME_DIR="/tmp/runtime-${UID}"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          export PULSE_SERVER="unix:${XDG_RUNTIME_DIR}/pulse/native"

          if pulseaudio \
            --daemonize=yes \
            --exit-idle-time=-1 \
            --log-target=file:/tmp/pulseaudio.log; then

            PULSE_READY=0

            for i in $(seq 1 20); do
              if pactl info >/dev/null 2>&1; then
                PULSE_READY=1
                break
              fi
              sleep 1
            done

            if [ "$PULSE_READY" -eq 1 ]; then
              if pactl load-module module-null-sink \
                sink_name=android_sink \
                sink_properties=device.description=AndroidAudioSink \
                rate=48000 channels=2; then
                pactl set-default-sink android_sink
                echo "PulseAudio sink created."
              else
                echo "WARNING: Could not create audio sink."
                AUDIO_ENABLED=0
              fi
            else
              echo "WARNING: PulseAudio did not start."
              cat /tmp/pulseaudio.log || true
              AUDIO_ENABLED=0
            fi
          else
            echo "WARNING: PulseAudio failed."
            AUDIO_ENABLED=0
          fi

          echo "STEP 12: Building optional audio server..."

          if [ "$AUDIO_ENABLED" -eq 1 ]; then
            if git clone --depth 1 \
              https://github.com/babelcloud/novnc-audio-server.git \
              /tmp/novnc-audio-server; then

              if (
                cd /tmp/novnc-audio-server
                pnpm install --no-frozen-lockfile
                pnpm run build
              ); then

                (
                  cd /tmp/novnc-audio-server
                  exec node dist/main.js \
                    --host 127.0.0.1 \
                    --port 6090 \
                    --path /audio \
                    --device android_sink \
                    --sample-rate 48000 \
                    --channels 2 \
                    --bitrate 64000 \
                    --latency 20000 \
                    --codec opus
                ) >/tmp/audio-server.log 2>&1 &
                AUDIO_PID=$!

                sleep 3

                if kill -0 "$AUDIO_PID" 2>/dev/null; then
                  echo "Audio server process started."
                else
                  echo "WARNING: Audio server did not start."
                  cat /tmp/audio-server.log
                  AUDIO_ENABLED=0
                  AUDIO_PID=""
                fi
              else
                echo "WARNING: Audio server build failed."
                AUDIO_ENABLED=0
              fi
            else
              echo "WARNING: Could not clone audio server."
              AUDIO_ENABLED=0
            fi
          fi

          echo "STEP 13: Starting Android 4.4..."

          adb start-server

          if [ "$AUDIO_ENABLED" -eq 1 ]; then
            export QEMU_AUDIO_DRV=pa
          fi

          emulator -avd kitkat \
            -writable-system \
            -selinux disabled \
            -sdcard "$SDCARD_IMAGE" \
            -port 5554 \
            -accel "$ACCEL" \
            -gpu "$GPU_MODE" \
            -no-snapshot \
            -no-boot-anim \
            -verbose \
            >/tmp/android-emulator.log 2>&1 &
          EMULATOR_PID=$!

          DEVICE_READY=0

          for i in $(seq 1 180); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "ERROR: Emulator exited unexpectedly."
              tail -n 200 /tmp/android-emulator.log
              exit 1
            fi

            if adb devices | grep -qE \
              '^emulator-5554[[:space:]]+device$'; then
              DEVICE_READY=1
              break
            fi

            sleep 2
          done

          if [ "$DEVICE_READY" -ne 1 ]; then
            echo "ERROR: Emulator did not connect to ADB."
            adb devices -l || true
            tail -n 200 /tmp/android-emulator.log
            exit 1
          fi

          echo "Waiting for Android to finish booting..."

          BOOTED=""

          for i in $(seq 1 180); do
            if ! kill -0 "$EMULATOR_PID" 2>/dev/null; then
              echo "ERROR: Emulator exited during boot."
              tail -n 200 /tmp/android-emulator.log
              exit 1
            fi

            BOOTED="$(adb -s emulator-5554 shell \
              getprop sys.boot_completed 2>/dev/null \
              | tr -d '\r' || true)"

            if [ "$BOOTED" = "1" ]; then
              break
            fi

            sleep 5
          done

          if [ "$BOOTED" != "1" ]; then
            echo "ERROR: Android did not finish booting."
            tail -n 200 /tmp/android-emulator.log
            exit 1
          fi

          echo "STEP 14: Attempting ADB and app root setup..."

          ADB_ROOT_OK=0
          APP_ROOT_OK=0

          adb -s emulator-5554 root || true
          adb -s emulator-5554 wait-for-device
          sleep 2

          ROOT_ID="$(adb -s emulator-5554 shell id 2>/dev/null \
            | tr -d '\r' || true)"

          echo "ADB identity: $ROOT_ID"

          if [[ "$ROOT_ID" == *"uid=0(root)"* ]]; then
            ADB_ROOT_OK=1

            if adb -s emulator-5554 remount; then
              if [ "$ROOT_FILES_OK" -eq 1 ]; then
                echo "Installing SuperSU manager..."

                if adb -s emulator-5554 install -r "$SU_MANAGER" \
                  && adb -s emulator-5554 push \
                    "$SU_BINARY" /system/xbin/su; then

                  adb -s emulator-5554 shell \
                    chown 0:0 /system/xbin/su || true

                  adb -s emulator-5554 shell \
                    chmod 0755 /system/xbin/su || true

                  adb -s emulator-5554 shell setenforce 0 || true

                  adb -s emulator-5554 shell \
                    /system/xbin/su --install || true

                  adb -s emulator-5554 shell \
                    "su --daemon >/dev/null 2>&1 &" || true

                  if adb -s emulator-5554 shell \
                    'test -x /system/xbin/su'; then
                    APP_ROOT_OK=1
                  fi
                else
                  echo "WARNING: SuperSU installation failed."
                fi
              fi
            else
              echo "WARNING: Could not remount /system."
            fi
          else
            echo "WARNING: ADB root unavailable."
          fi

          echo "ADB_ROOT_OK=$ADB_ROOT_OK"
          echo "APP_ROOT_OK=$APP_ROOT_OK"

          echo "STEP 15: Installing system apps from systemapps/..."

          SYSTEMAPP_DIR="$GITHUB_WORKSPACE/systemapps"
          SYSTEMAPP_FILES=()

          if [ -d "$SYSTEMAPP_DIR" ]; then
            while IFS= read -r -d '' APK; do
              SYSTEMAPP_FILES+=("$APK")
            done < <(
              find "$SYSTEMAPP_DIR" -maxdepth 1 \
                -type f -iname '*.apk' -print0 | sort -z
            )
          fi

          echo "System APKs found: ${#SYSTEMAPP_FILES[@]}"

          if [ "${#SYSTEMAPP_FILES[@]}" -gt 0 ]; then
            adb -s emulator-5554 root || true
            adb -s emulator-5554 wait-for-device
            sleep 2

            ROOT_ID="$(adb -s emulator-5554 shell id 2>/dev/null \
              | tr -d '\r' || true)"

            if [[ "$ROOT_ID" != *"uid=0(root)"* ]]; then
              echo "ERROR: Root is required to install system apps."
              exit 1
            fi

            adb -s emulator-5554 remount

            if ! adb -s emulator-5554 shell \
              'touch /system/.workflow_write_test && rm /system/.workflow_write_test'; then
              echo "ERROR: /system is not writable."
              exit 1
            fi

            adb -s emulator-5554 shell mkdir -p /system/app

            INDEX=0

            for APK in "${SYSTEMAPP_FILES[@]}"; do
              INDEX=$((INDEX + 1))
              TARGET="/system/app/RepositorySystemApp_${INDEX}.apk"

              echo "Adding system app: $(basename "$APK")"

              adb -s emulator-5554 push "$APK" "$TARGET"
              adb -s emulator-5554 shell chown 0:0 "$TARGET"
              adb -s emulator-5554 shell chmod 0644 "$TARGET"

              adb -s emulator-5554 shell \
                restorecon "$TARGET" || true
            done

            echo "Rebooting Android to register system apps..."

            adb -s emulator-5554 reboot || true
            adb -s emulator-5554 wait-for-device

            BOOTED=""

            for i in $(seq 1 180); do
              BOOTED="$(adb -s emulator-5554 shell \
                getprop sys.boot_completed 2>/dev/null \
                | tr -d '\r' || true)"

              if [ "$BOOTED" = "1" ]; then
                break
              fi

              sleep 5
            done

            if [ "$BOOTED" != "1" ]; then
              echo "ERROR: Android failed to reboot."
              exit 1
            fi

            echo "System apps registered."
          fi

          echo "STEP 16: Installing regular APKs from apks/..."

          APK_DIR="$GITHUB_WORKSPACE/apks"
          APK_FILES=()

          if [ -d "$APK_DIR" ]; then
            while IFS= read -r -d '' APK; do
              APK_FILES+=("$APK")
            done < <(
              find "$APK_DIR" -maxdepth 1 \
                -type f -iname '*.apk' -print0 | sort -z
            )
          fi

          echo "Regular APKs found: ${#APK_FILES[@]}"

          for APK in "${APK_FILES[@]}"; do
            echo "Installing normally: $(basename "$APK")"

            if adb -s emulator-5554 install -r "$APK"; then
              echo "Installed $(basename "$APK")."
            else
              echo "WARNING: Could not install $(basename "$APK")."
            fi
          done

          echo "STEP 17: Refreshing root status and Android settings..."

          adb -s emulator-5554 root || true
          adb -s emulator-5554 wait-for-device
          sleep 2

          ROOT_ID="$(adb -s emulator-5554 shell id 2>/dev/null \
            | tr -d '\r' || true)"

          if [[ "$ROOT_ID" == *"uid=0(root)"* ]]; then
            ADB_ROOT_OK=1
          else
            ADB_ROOT_OK=0
          fi

          if adb -s emulator-5554 shell \
            'test -x /system/xbin/su'; then
            APP_ROOT_OK=1
          else
            APP_ROOT_OK=0
          fi

          adb -s emulator-5554 shell \
            settings put global window_animation_scale 0 || true

          adb -s emulator-5554 shell \
            settings put global transition_animation_scale 0 || true

          adb -s emulator-5554 shell \
            settings put global animator_duration_scale 0 || true

          adb -s emulator-5554 shell \
            settings put system screen_off_timeout 2147483647 || true

          echo ""
          echo "================================================"
          echo "             ANDROID 4.4 IS READY"
          echo "================================================"

          echo ""
          echo "===== BROWSER LINK ====="
          echo "$BROWSER_URL"

          echo ""
          echo "===== CPU VIRTUALIZATION ====="
          echo "Emulator acceleration setting: $ACCEL"

          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "KVM device: AVAILABLE"
          else
            echo "KVM device: UNAVAILABLE"
          fi

          echo "Emulator acceleration diagnostic:"
          "$ANDROID_HOME/emulator/emulator" -accel-check 2>&1 || true

          echo "Virtualization flags exposed to runner:"
          grep -m 1 -Eo '\b(vmx|svm)\b' /proc/cpuinfo \
            || echo "No VMX/SVM flag exposed."

          echo "KVM device details:"
          ls -l /dev/kvm 2>/dev/null || echo "/dev/kvm does not exist."

          echo ""
          echo "===== HOST RESOURCES ====="
          echo "Runner CPU threads: $(nproc)"

          echo "Runner CPU model:"
          grep -m 1 "model name" /proc/cpuinfo || true

          echo "Runner memory:"
          free -h

          echo "Runner CPU details:"
          lscpu | grep -E \
            '^(Architecture|CPU\(s\)|Model name|Virtualization|Hypervisor vendor):' \
            || true

          echo "Visible graphics devices:"
          lspci 2>/dev/null \
            | grep -Ei 'VGA|3D controller|Display controller' \
            || echo "No graphics device information exposed."

          echo ""
          echo "===== EMULATOR GRAPHICS ====="
          echo "Emulator GPU mode: $GPU_MODE (software rendering)"
          echo "Configured Android display: 360x640"
          echo "Configured virtual desktop: 800x900"
          echo "x11vnc wait/defer: 10 ms / 10 ms"
          echo "noVNC quality: 5"
          echo "noVNC compression: 1"

          echo "Actual Android screen size:"
          adb -s emulator-5554 shell wm size 2>&1 || true

          echo "Actual Android screen density:"
          adb -s emulator-5554 shell wm density 2>&1 || true

          echo "Android OpenGL ES version:"
          adb -s emulator-5554 shell \
            getprop ro.opengles.version || true

          echo ""
          echo "===== ANDROID INFORMATION ====="
          echo "Android version:"
          adb -s emulator-5554 shell \
            getprop ro.build.version.release || true

          echo "Android API level:"
          adb -s emulator-5554 shell \
            getprop ro.build.version.sdk || true

          echo "Android CPU ABI:"
          adb -s emulator-5554 shell \
            getprop ro.product.cpu.abi || true

          echo "Android boot status:"
          adb -s emulator-5554 shell \
            getprop sys.boot_completed || true

          echo "Current ADB identity:"
          adb -s emulator-5554 shell id 2>&1 || true

          echo ""
          echo "===== STORAGE ====="
          echo "Virtual SD card image:"
          ls -lh "$SDCARD_IMAGE" 2>&1 || true

          echo "Android storage space:"
          adb -s emulator-5554 shell \
            'df -h /data /sdcard 2>/dev/null || true'

          echo ""
          echo "===== ROOT STATUS ====="
          echo "ADB root detected: $ADB_ROOT_OK"
          echo "SU binary present: $APP_ROOT_OK"

          echo "SU binary details:"
          adb -s emulator-5554 shell \
            'ls -l /system/xbin/su 2>/dev/null || true'

          echo ""
          echo "===== AUDIO STATUS ====="
          echo "Audio setup enabled: $AUDIO_ENABLED"

          if [ "$AUDIO_ENABLED" -eq 1 ]; then
            echo "PulseAudio server:"
            pactl info 2>&1 || true

            echo "Available audio sinks:"
            pactl list short sinks 2>&1 || true

            echo "Available monitor sources:"
            pactl list short sources 2>&1 \
              | grep monitor || true

            if [ -n "$AUDIO_PID" ] \
              && kill -0 "$AUDIO_PID" 2>/dev/null; then
              echo "Audio server process: RUNNING"
            else
              echo "Audio server process: NOT RUNNING"
            fi
          else
            echo "Audio setup failed or was disabled."
            cat /tmp/pulseaudio.log 2>/dev/null || true
            cat /tmp/audio-server.log 2>/dev/null || true
          fi

          echo ""
          echo "===== STREAM CONNECTIVITY ====="

          echo "Local noVNC HTTP response:"
          curl -sS -o /dev/null \
            --max-time 5 \
            -w "HTTP %{http_code}\n" \
            http://127.0.0.1:6080/vnc.html || true

          echo "Nginx configuration test:"
          sudo nginx -t 2>&1 || true

          echo "VNC server process:"
          if kill -0 "$VNC_PID" 2>/dev/null; then
            echo "RUNNING"
          else
            echo "NOT RUNNING"
          fi

          echo "WebSocket proxy process:"
          if kill -0 "$WEBSOCKIFY_PID" 2>/dev/null; then
            echo "RUNNING"
          else
            echo "NOT RUNNING"
          fi

          echo "Cloudflare tunnel process:"
          if kill -0 "$TUNNEL_PID" 2>/dev/null; then
            echo "RUNNING"
          else
            echo "NOT RUNNING"
          fi

          echo "Local listening ports:"
          ss -ltnp 2>/dev/null \
            | grep -E ':5900|:6080|:6081|:6090' || true

          echo ""
          echo "===== APK COUNTS ====="
          echo "System APKs: ${#SYSTEMAPP_FILES[@]}"
          echo "Regular APKs: ${#APK_FILES[@]}"

          echo ""
          echo "===== PERFORMANCE DIAGNOSIS ====="

          if [ "$ACCEL" != "on" ]; then
            echo "WARNING: KVM is unavailable."
            echo "CPU emulation may be a major source of lag."
          else
            echo "KVM was selected for CPU acceleration."
          fi

          echo "Graphics mode is SwiftShader software rendering."
          echo "Graphics processing may be another source of lag."
          echo "If Android runs well locally but the stream is choppy,"
          echo "the VNC and network stream may be the bottleneck."

          echo ""
          echo "================================================"
          echo "YOUR ANDROID 4.4 BROWSER LINK:"
          echo "$BROWSER_URL"
          echo "KEEP THIS WORKFLOW RUNNING"
          echo "================================================"

          while kill -0 "$EMULATOR_PID" 2>/dev/null \
            && kill -0 "$TUNNEL_PID" 2>/dev/null; do

            if [ "$AUDIO_ENABLED" -eq 1 ] \
              && [ -n "$AUDIO_PID" ] \
              && ! kill -0 "$AUDIO_PID" 2>/dev/null; then
              echo "WARNING: Audio server stopped."
              cat /tmp/audio-server.log
              AUDIO_ENABLED=0
              AUDIO_PID=""
            fi

            sleep 30
          done

          echo "ERROR: Emulator or Cloudflare Tunnel stopped."
          tail -n 100 /tmp/android-emulator.log
          cat /tmp/cloudflared.log
